[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptolab"
version = "1.1.0"
description = "Independent cryptocurrency forecasting and paper-trading research system (public data only, no real trading)"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "lightgbm>=4.0",
  "pyarrow>=14",
  "cloudpickle>=3.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
cryptolab = "cryptolab.cli:main"

[tool.setuptools.packages.find]
include = ["cryptolab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
