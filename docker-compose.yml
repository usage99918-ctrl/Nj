# docker compose up -d   (restarts automatically after crashes and host reboots)
services:
  cryptolab:
    build: .
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./reports:/app/reports
  dashboard:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "cryptolab", "serve", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
